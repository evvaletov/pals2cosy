# Beamline excerpt from the University of Hawaii FEL, in PALS format.
#
# Linac quadrupoles and the first chicane dipole. Quadrupole strengths are
# PALS field gradients Bn1 = -G*I [T/m] from the magnet calibration
# G = 2.694 T/(A m) and the setpoint currents; for electrons a negative Bn1
# focuses horizontally.
#
PALS:
  version: null

  facility:
    # --- Element definitions ---

    - start:
        kind: BeginningEle
        ReferenceP:
          species_ref: electron
          E_tot_ref: 40.51099895e6   # [eV] 40 MeV kinetic + electron rest energy

    - d_pre_lin:
        kind: Drift
        length: 0.358775

    - LQ1:
        kind: Quadrupole
        length: 0.0889
        MagneticMultipoleP:
          Bn1: -2.38612815   # QPF: -2.694 T/(A m) * 0.8857 A

    - d_lin_12:
        kind: Drift
        length: 0.195

    - LQ2:
        kind: Quadrupole
        length: 0.0889
        MagneticMultipoleP:
          Bn1: 2.83648593    # QPD: 2.694 T/(A m) * 1.0529 A

    - d_lin_post:
        kind: Drift
        length: 0.197625

    - DPHQ:
        kind: Quadrupole
        length: 0.0889
        MagneticMultipoleP:
          Bn1: -10.28193037  # QPF

    - d_pre_dc1:
        kind: Drift
        length: 0.71013

    - DC1_B1:
        kind: Bend
        length: 0.0889
        BendP:
          angle_ref: 0.02618   # 1.5 deg
          e1: 0.0
          e2: 0.02618          # parallel pole faces

    # --- Beamline composition ---

    - uhfel_excerpt:
        kind: BeamLine
        line:
          - start
          - d_pre_lin
          - LQ1
          - d_lin_12
          - LQ2
          - d_lin_post
          - DPHQ
          - d_pre_dc1
          - DC1_B1

    # --- Lattice ---

    - excerpt_lattice:
        kind: Lattice
        branches:
          - uhfel_excerpt

    - use: excerpt_lattice
