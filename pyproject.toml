[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pals2cosy"
version = "0.6.0"
description = "Convert PALS lattice files to COSY INFINITY input code"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Eremey Valetov", email = "evv@msu.edu"}]
keywords = ["beam-physics", "accelerator", "COSY-INFINITY", "PALS", "lattice", "transfer-map"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["pyyaml"]

[project.optional-dependencies]
toml = ["tomli; python_version < '3.11'"]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/evvaletov/pals2cosy"
Repository = "https://github.com/evvaletov/pals2cosy"
Changelog = "https://github.com/evvaletov/pals2cosy/blob/main/CHANGELOG.md"
Issues = "https://github.com/evvaletov/pals2cosy/issues"

[tool.setuptools.package-data]
pals2cosy = ["examples/*.yaml"]

[project.scripts]
pals2cosy = "pals2cosy.cli:main"
